<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Donation Alert Widget</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  #stage {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .alert-card {
    display: flex;
    align-items: center;
    gap: 16px;
    min-width: 420px;
    max-width: 640px;
    padding: 18px 24px;
    border-radius: 12px;
    background: #1a1625;
    border: 1px solid #3a3450;
  }

  .icon-wrap {
    flex: 0 0 auto;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    background: #a855f7;
  }

  .alert-body {
    flex: 1 1 auto;
    min-width: 0;
  }

  .alert-title {
    margin: 0 0 4px;
    font-size: 14px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.65);
  }

  .alert-title .donor-name {
    color: #ffffff;
    font-size: 18px;
    font-weight: 800;
  }

  .alert-amount {
    margin: 2px 0 6px;
    font-size: 24px;
    font-weight: 800;
    color: #ec4899;
  }

  .alert-message {
    margin: 0;
    font-size: 15px;
    line-height: 1.4;
    color: rgba(255, 255, 255, 0.9);
    word-break: break-word;
  }
</style>
</head>
<body>
  <div id="stage"></div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const streamKey = params.get("streamKey");
      const stage = document.getElementById("stage");

      const DISPLAY_MS = 6000;

      const queue = [];
      let isPlaying = false;

      function formatAmount(amount, currency) {
        try {
          return new Intl.NumberFormat("id-ID", {
            style: "currency",
            currency: currency || "IDR",
            maximumFractionDigits: 0,
          }).format(amount);
        } catch (e) {
          return `${currency || "IDR"} ${amount}`;
        }
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str ?? "";
        return div.innerHTML;
      }

      function renderCard(donation) {
        const card = document.createElement("div");
        card.className = "alert-card";
        card.innerHTML = `
          <div class="icon-wrap">🎉</div>
          <div class="alert-body">
            <p class="alert-title">Donasi dari <span class="donor-name">${escapeHtml(donation.donatorName)}</span></p>
            <p class="alert-amount">${formatAmount(donation.amount, donation.currency)}</p>
            ${donation.message ? `<p class="alert-message">${escapeHtml(donation.message)}</p>` : ""}
          </div>
        `;

        stage.appendChild(card);

        return new Promise((resolve) => {
          setTimeout(() => {
            card.remove();
            resolve();
          }, DISPLAY_MS);
        });
      }

      async function processQueue() {
        if (isPlaying) return;
        isPlaying = true;
        while (queue.length > 0) {
          const donation = queue.shift();
          await renderCard(donation);
        }
        isPlaying = false;
      }

      function enqueueDonation(donation) {
        queue.push(donation);
        processQueue();
      }

      function connect() {
        if (!streamKey) {
          stage.innerHTML =
            '<p style="color:#f87171;font-family:sans-serif;font-size:14px;">Missing streamKey in widget URL</p>';
          return;
        }

        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${protocol}//${window.location.host}/widgets/alert?streamKey=${encodeURIComponent(streamKey)}`;
        const socket = new WebSocket(wsUrl);

        socket.addEventListener("message", (event) => {
          try {
            const payload = JSON.parse(event.data);
            if (payload.type === "donation" && payload.data) {
              enqueueDonation(payload.data);
            }
          } catch (e) {
            console.error("Invalid message from server", e);
          }
        });

        socket.addEventListener("close", () => {
          setTimeout(connect, 3000);
        });

        socket.addEventListener("error", () => {
          socket.close();
        });
      }

      connect();
    })();
  </script>
</body>
</html>
